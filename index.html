const live=()=>{pn.innerHTML='';if(st){const b=document.createElement('button');b.style.width='100%';b.textContent='📸 Capturer le numéro';b.onclick=fromVideo;pn.appendChild(b)}pn.appendChild(nat());const c=document.createElement('button');c.className='s';c.style.width='100%';c.textContent='Annuler';c.onclick=end;pn.appendChild(c)};
const cands=async()=>{let t=[];if('TextDetector'in window){try{const r=await new TextDetector().detect(cv);t=r.map(x=>nz(x.rawValue)).filter(x=>/^[A-Z0-9]{6,24}$/.test(x)&&/\d{4,}/.test(x))}catch(e){}}return[...new Set(t)]};
const after=async()=>{v.style.display='none';cv.style.display='block';hint.textContent='Touchez la photo pour agrandir';stopCam();
let zoom=0;cv.onclick=e=>{zoom=!zoom;const r=cv.getBoundingClientRect();cv.style.transformOrigin=((e.clientX-r.left)/r.width*100)+'% '+((e.clientY-r.top)/r.height*100)+'%';cv.style.transform=zoom?'scale(2.6)':'none'};
const nums=[...new Set(M.map(m=>String(m.num||'')).filter(Boolean))],T=await cands();
if(k=='ancien'&&T.length){const hit=T.map(t=>nums.find(n=>nz(n)==t)).filter(Boolean);if(hit.length==1)return pick(hit[0])}
pn.innerHTML=(T.length?'<div style="color:#94a3b8">Numéros détectés :</div><div style="display:flex;flex-wrap:wrap;gap:6px;margin:6px 0">'+T.map(t=>'<button class="s" style="width:auto;min-height:44px;line-height:44px;margin:0" onclick="_rdPick('+jsArg(t)+')">'+esc(t)+'</button>').join('')+'</div>':'')+
'<label style="color:#cbd5e1">'+(k=='ancien'?'Tapez les derniers chiffres lus (la liste se filtre)':'Tapez le numéro lu')+'</label><input id="rin" autocapitalize="characters" autocomplete="off" style="width:100%;font-size:22px;letter-spacing:1px" placeholder="'+(k=='ancien'?'ex. 3902':'numéro')+'"><div id="rsg"></div><button class="ok" id="rok" style="width:100%">Valider</button><button class="s" style="width:100%" id="rre">↩ Reprendre la photo</button><button class="s" style="width:100%" onclick="_rdEnd()">Annuler</button>';
const inp=pn.querySelector('#rin'),sg=pn.querySelector('#rsg');inp.oninput=()=>{inp.value=inp.value.toUpperCase();const q=nz(inp.value);if(k!='ancien'||q.length<2){sg.innerHTML='';return}
const L=nums.filter(n=>nz(n).includes(q)).sort((a,b)=>(nz(b).endsWith(q)-nz(a).endsWith(q))||a.localeCompare(b)).slice(0,8);
sg.innerHTML=L.map(n=>{const m=M.find(x=>String(x.num)==n)||{};return'<button class="s" style="margin:4px 0;text-align:left;line-height:1.3;padding:8px 12px;min-height:50px" onclick="_rdPick('+jsArg(n)+')"><b>'+esc(n)+'</b><br><small>'+esc(m.nom||'')+' · '+esc(m.adresse||'')+'</small></button>'}).join('')||'<div style="color:#94a3b8;margin:6px 0">Aucun compteur importé ne correspond.</div>'};
pn.querySelector('#rok').onclick=()=>{const q=nz(inp.value);if(!q)return say('Tapez un numéro');pick(q)};pn.querySelector('#rre').onclick=()=>{end();readNum(k)};setTimeout(()=>inp.focus(),150)};
const fromVideo=()=>{if(!v.videoWidth)return say('Caméra pas encore prête…');cv.width=v.videoWidth;cv.height=v.videoHeight;cv.getContext('2d').drawImage(v,0,0);after()};
const fromFile=async f=>{if(!f)return;try{const bm=await createImageBitmap(f),sc=Math.min(1,2200/Math.max(bm.width,bm.height));cv.width=Math.round(bm.width*sc);cv.height=Math.round(bm.height*sc);cv.getContext('2d').drawImage(bm,0,0,cv.width,cv.height);after()}catch(e){hint.textContent='Photo illisible : '+(e.message||e.name)}};
let err='';if(!navigator.mediaDevices?.getUserMedia)err='non prise en charge';else{for(const c of [{video:{facingMode:{ideal:'environment'}},audio:false},{video:true,audio:false}]){try{st=await navigator.mediaDevices.getUserMedia(c);break}catch(e){err=e.name||'erreur'}}}
if(st){v.srcObject=st;try{await v.play()}catch(e){}hint.textContent='Cadrez le numéro écrit sur le compteur'}else{v.style.display='none';hint.textContent='Caméra directe indisponible ('+err+'). Utilisez l’appareil photo du téléphone.'}
live()}
function stopScan(){scanning=false;stream?.getTracks().forEach(t=>t.stop());stream=null;$('#vid').style.display='none'}
init();
</script></body></html>
