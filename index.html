<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5ed7"><title>Smart Remplacement</title>
<style>
:root{--bg:#eef2f7;--c:#fff;--t:#0f172a;--m:#64748b;--p:#1257d6;--p2:#0b3d91;--b:#e2e8f0;--ok:#12a150;--wa:#f59e0b;--er:#e5393a;--sh:0 1px 3px rgba(15,23,42,.1),0 6px 16px rgba(15,23,42,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--c:#162033;--t:#f1f5f9;--m:#94a3b8;--b:#26344d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t);padding-bottom:86px}
header{background:linear-gradient(135deg,var(--p2),var(--p));color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 12px rgba(11,61,145,.35)}
header b{font-size:18px;letter-spacing:.4px;display:flex;gap:8px;align-items:center}#net{font-size:12px;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:99px;display:flex;gap:6px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:#fca5a5}.dot.on{background:#4ade80}
main{padding:14px;max-width:760px;margin:auto}.card{background:var(--c);border-radius:16px;padding:14px;margin:12px 0;box-shadow:var(--sh)}.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mut{color:var(--m);font-size:14px}h2{margin:8px 0 2px;font-size:22px}h3{margin:6px 0}
.kpi{background:var(--c);border-radius:16px;padding:14px;box-shadow:var(--sh);border-left:6px solid var(--k,#1257d6)}.kpi b{display:block;font-size:30px;line-height:1.1;color:var(--k,#1257d6)}.kpi span{font-size:13px;color:var(--m)}
.bar{height:12px;background:var(--b);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#12a150,#4ade80)}
button,.btn{min-height:52px;font-size:16px;font-weight:700;border-radius:14px;border:0;background:linear-gradient(135deg,var(--p2),var(--p));color:#fff;width:100%;margin:6px 0;padding:0 14px;display:block;text-align:center;line-height:52px;box-shadow:0 3px 10px rgba(18,87,214,.3)}
button.s,.btn.s{background:var(--c);color:var(--p);border:1.5px solid var(--p);box-shadow:none}button.ok{background:linear-gradient(135deg,#0d8a43,var(--ok));box-shadow:0 3px 10px rgba(18,161,80,.3)}button.er{background:var(--er);box-shadow:none}
input,select,textarea{width:100%;min-height:50px;font-size:16px;padding:8px 12px;border:1.5px solid var(--b);border-radius:12px;background:var(--c);color:var(--t);margin:4px 0 10px}input:focus,select:focus,textarea:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 3px rgba(18,87,214,.18)}
label{font-size:13px;color:var(--m);font-weight:600}nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);box-shadow:0 -2px 14px rgba(15,23,42,.12);padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 1px 7px;font-size:11px;color:var(--m);text-decoration:none}nav a.on{color:var(--p);font-weight:700}nav a.on svg{background:rgba(18,87,214,.12);border-radius:12px;padding:3px 10px;width:44px;height:30px}
.it{display:flex;justify-content:space-between;gap:8px;align-items:center}.tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;color:#fff;white-space:nowrap}.w{color:#b45309;font-weight:600}
.row{border-left:6px solid var(--k);cursor:pointer}img.ph{width:100%;border-radius:12px;margin:6px 0}table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid var(--b);padding:6px 3px;text-align:left}
.steps{display:flex;gap:6px;margin:12px 0 4px}.steps i{flex:1;height:6px;border-radius:9px;background:var(--b)}.steps i.on{background:var(--p)}
.mapw{position:fixed;left:0;right:0;background:#e8e6df;overflow:hidden;z-index:2}#rd{display:block;width:100%;height:100%;touch-action:none}.sheet{position:absolute;left:10px;right:10px;bottom:10px;background:var(--c);border-radius:18px;padding:12px;box-shadow:0 6px 24px rgba(0,0,0,.3)}.sheet button{min-height:46px;line-height:46px;margin:6px 0 0}.g3{display:grid;grid-template-columns:1fr 2fr 1fr;gap:8px}.pill{position:absolute;left:50%;transform:translateX(-50%);top:12px;background:#1e293b;color:#fff;font-size:13px;padding:6px 12px;border-radius:99px;display:none;white-space:nowrap}
.lgd{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.94);color:#0f172a;border-radius:12px;padding:6px 10px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.2);display:grid;gap:3px}.lgd i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.srch{position:absolute;left:10px;right:66px;top:10px;z-index:3}.srch input{margin:0;min-height:46px;border-radius:23px;padding:0 16px;box-shadow:0 2px 8px rgba(0,0,0,.3)}#mr{background:var(--c);border-radius:14px;margin-top:6px;max-height:40vh;overflow:auto;box-shadow:0 4px 14px rgba(0,0,0,.3)}#mr div{padding:10px 14px;border-bottom:1px solid var(--b)}.lgd{top:64px}.nr{display:flex;align-items:center;gap:10px;padding:6px 2px;border-bottom:1px solid var(--b)}.nr .dd{margin-left:auto;color:var(--m)}.ar{display:inline-block;font-size:22px;color:var(--p);width:28px;text-align:center}.ar.big{font-size:36px;width:44px}.pill{top:64px}.fabs{position:absolute;right:10px;top:10px}.fabs button{width:46px;min-height:46px;height:46px;padding:0;margin:0 0 8px;border-radius:50%;background:#fff;color:#0f172a;box-shadow:0 2px 8px rgba(0,0,0,.3);display:grid;place-items:center;line-height:1}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}#dlg div{background:var(--c);color:var(--t);border-radius:18px;padding:18px;max-width:420px;width:100%}#dlg p,#toast{white-space:pre-line}#toast{position:fixed;left:12px;right:12px;top:62px;background:#1e293b;color:#fff;padding:14px;border-radius:14px;z-index:30;box-shadow:var(--sh)}
#vid{position:fixed;inset:0;background:#000;z-index:9;display:none}#vid video{width:100%;height:80%}#vid button{position:absolute;bottom:20px;left:5%;width:90%}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:100px;line-height:1.2;padding:10px}.tile svg{width:30px;height:30px}.tile span{font-size:18px}.tile small{font-weight:500;opacity:.9;font-size:12px}.tile.x{background:linear-gradient(135deg,#0d8a43,#12a150)}.tile.p{background:linear-gradient(135deg,#b91c1c,#e5393a)}.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}</style></head><body>
<header><b><svg viewBox="0 0 24 24" width="26" height="26" fill="#fff"><path d="M12 2.5s6.5 6.6 6.5 11.3a6.5 6.5 0 11-13 0C5.5 9.1 12 2.5 12 2.5z"/></svg>Smart Remplacement</b><span id="net"></span></header><main id="app"></main>
<div id="vid"><video playsinline muted></video><button class="er" onclick="stopScan()">Fermer</button></div>
<nav id="nav"></nav>
<script>
onerror=(m,u,l)=>{const a=document.getElementById('app');if(a)a.innerHTML='<div class="card">⚠️ Erreur : '+String(m).replace(/</g,'&lt;')+' (ligne '+l+')</div>'};
function say(m){const t=document.createElement('div');t.id='toast';t.textContent=m;t.onclick=()=>t.remove();document.body.appendChild(t);setTimeout(()=>t.remove(),7000)}
const ask=m=>new Promise(r=>{const d=document.createElement('div');d.id='dlg';d.innerHTML='<div><p></p><button class="ok">Oui</button><button class="s">Non</button></div>';d.querySelector('p').textContent=m;const[y,n]=d.querySelectorAll('button');y.onclick=()=>{d.remove();r(true)};n.onclick=()=>{d.remove();r(false)};document.body.appendChild(d)});
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let M=[],db,tab='home',cur=null,step=0,D={},Q='',F={etat:'',tour:'',com:''},imp=null,dayF=new Date().toISOString().slice(0,10);
const ST=['À faire','En cours','Terminé','Problème'],agent=()=>localStorage.getItem('agent')||'';
const FIELDS=[['num','Numéro compteur'],['contrat','Numéro contrat'],['nom','Nom client'],['adresse','Adresse'],['commune','Commune'],['gps','GPS'],['type','Type compteur'],['dn','DN'],['idx','Ancien index'],['tournee','Tournée'],['lat','Latitude'],['lon','Longitude']];
/* ---- DB ---- */
const open=()=>new Promise(r=>{try{const q=indexedDB.open('smartrempl',2);q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains('m'))d.createObjectStore('m',{keyPath:'id'});if(!d.objectStoreNames.contains('t'))d.createObjectStore('t')};q.onsuccess=()=>{db=q.result;r()};q.onerror=q.onblocked=()=>r()}catch(e){r()}});
const tx=(m)=>db.transaction('m',m).objectStore('m');
const put=m=>new Promise(r=>{if(!db){if(!M.find(x=>x.id==m.id))M.push(m);return r()}tx('readwrite').put(m).onsuccess=r});
const loadAll=()=>new Promise(r=>{if(!db)return r();tx('readonly').getAll().onsuccess=e=>{M=e.target.result;r()}});
const clearAll=()=>new Promise(r=>{if(!db){M=[];return r()}tx('readwrite').clear().onsuccess=r});
async function init(){await open();if(!db)say('⚠️ Stockage local indisponible : ouvrez ce fichier directement dans Chrome (pas dans un aperçu). Les données seront perdues à la fermeture.');await loadAll();RD=await tget('roads')||null;RW=await tget('water')||[];addEventListener('deviceorientationabsolute',e=>{if(e.alpha!=null){HC=(360-e.alpha)%360;arrows()}});addEventListener('deviceorientation',e=>{if(e.webkitCompassHeading!=null){HC=e.webkitCompassHeading;arrows()}});if('serviceWorker'in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});navigator.storage?.persist?.();addEventListener('online',net);addEventListener('offline',net);net();addEventListener('input',saveUI,true);document.addEventListener('click',e=>{if(e.target.type=='file')saveUInow()},true);addEventListener('pagehide',saveUInow);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveUInow()});const U=await tget('ui'),W=['wiz','fiche','hist'];if(U&&U.tab&&U.tab!='home'&&Date.now()-U.t<432e5&&(!W.includes(U.tab)||M.some(m=>m.id==U.cur))){step=U.step||0;D=U.D||D;go(U.tab,U.cur);if(U.tab=='wiz')say('↩ Reprise de l\'étape en cours. Reprenez la photo si elle n\'apparaît pas.')}else go('home')}
let UIsv=0;const uiS=()=>({tab,cur,step,D,t:Date.now()});function saveUI(){clearTimeout(UIsv);UIsv=setTimeout(()=>tput('ui',uiS()),300)}function saveUInow(){clearTimeout(UIsv);tput('ui',uiS())}
const net=()=>$('#net').innerHTML=`<i class="dot ${navigator.onLine?'on':''}"></i>${navigator.onLine?'En ligne':'Hors ligne'}`;
/* ---- nav ---- */
const ico=p=>`<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC={layers:ico('<path d="M12 3l9 5-9 5-9-5 9-5zM3 13l9 5 9-5"/>'),dl:ico('<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>'),home:ico('<path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>'),list:ico('<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>'),map:ico('<path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>'),ctrl:ico('<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/>'),data:ico('<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>'),set:ico('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'),plus:ico('<path d="M12 5v14M5 12h14"/>'),minus:ico('<path d="M5 12h14"/>'),loc:ico('<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/>')};
const SC={'À faire':'#64748b','En cours':'#f59e0b','Terminé':'#12a150','Problème':'#e5393a'};
const TABS=[['home','Accueil'],['list','Compteurs'],['map','Carte'],['ctrl','Contrôle'],['data','Données'],['set','Paramètres']];
function go(t,id){tab=t;if(id!==undefined)cur=id;$('#nav').innerHTML=TABS.map(([k,l])=>`<a href="#" class="${k==tab?'on':''}" onclick="go('${k}',null);return false">${IC[k]}<span>${l}</span></a>`).join('');R();scrollTo(0,0)}
function R(){saveUI();if(tab!='map'&&watch!=null){navigator.geolocation.clearWatch(watch);watch=null}const f={home,list,ctrl,data,set,fiche,wiz,hist,map:mapV}[tab];$('#app').innerHTML=f()}
const cnt=s=>M.filter(m=>m.etat==s).length,bad=m=>m.warns?.length;
/* ---- views ---- */
let NEAR=false;
function sortN(a){return NEAR&&me?a.sort((x,y)=>(ll(x)?dist([me.lat,me.lon],ll(x)):9e9)-(ll(y)?dist([me.lat,me.lon],ll(y)):9e9)):a}
function nearMe(){if(NEAR){NEAR=false;return R()}if(!navigator.geolocation)return say('⚠️ GPS indisponible');say('Recherche de votre position…');navigator.geolocation.getCurrentPosition(p=>{me={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy};NEAR=true;R()},()=>say('⚠️ GPS indisponible'),{enableHighAccuracy:true,timeout:20000})}
let SF={ag:'',com:'',tour:'',date:''};
const sfm=m=>(!SF.ag||m.rep?.agent==SF.ag)&&(!SF.com||m.commune==SF.com)&&(!SF.tour||m.tournee==SF.tour)&&(!SF.date||m.rep?.date==SF.date);
const sfUI=()=>{const o=(a,v)=>'<option value="">Tous</option>'+a.map(x=>`<option ${x==v?'selected':''}>${esc(x)}</option>`).join('');const ags=[...new Set(M.flatMap(m=>(m.hist||[]).map(h=>h.agent)).filter(Boolean))];
return `<div class="card"><div class="g"><div><label>Agent</label><select onchange="SF.ag=this.value;R()">${o(ags,SF.ag)}</select></div><div><label>Tournée</label><select onchange="SF.tour=this.value;R()">${o(uniq('tournee'),SF.tour)}</select></div><div><label>Commune</label><select onchange="SF.com=this.value;R()">${o(uniq('commune'),SF.com)}</select></div><div><label>Date opération</label><input type="date" value="${SF.date}" onchange="SF.date=this.value;R()"></div></div></div>`};
function home(){const S=M.filter(sfm),c=s=>S.filter(m=>m.etat==s).length,t=new Date().toISOString().slice(0,10),rp=S.filter(m=>m.rep),d=rp.filter(m=>m.rep.date==dayF).length,pc=S.length?Math.round(rp.length*100/S.length):0;
const K=(a,b,col)=>`<div class="kpi" style="--k:${col}"><b>${b}</b><span>${a}</span></div>`;
return sfUI()+`<div class="card"><div class="it"><b>Avancement</b><b style="color:var(--ok)">${pc}%</b></div><div class="bar"><i style="width:${pc}%"></i></div><span class="mut">${rp.length} remplacés sur ${S.length}</span></div>
<div class="g">${K('Total',S.length,'#1257d6')}${K('Restants',S.length-rp.length,'#f59e0b')}${K('À faire',c('À faire'),'#64748b')}${K('En cours',c('En cours'),'#f59e0b')}${K('Terminés',c('Terminé'),'#12a150')}${K('Problèmes',c('Problème'),'#e5393a')}</div>
<div class="card"><label>Compteurs remplacés le</label><input type="date" value="${dayF}" onchange="dayF=this.value;R()"><div class="it"><b style="font-size:30px;color:var(--ok)">${d}</b><span class="mut">Aujourd'hui ${rp.filter(m=>m.rep.date==t).length} · Semaine ${rp.filter(m=>Date.now()-new Date(m.rep.date)<6048e5).length} · Mois ${rp.filter(m=>m.rep.date?.slice(0,7)==t.slice(0,7)).length}</span></div></div>
<button onclick="go('list')">Voir les compteurs</button>${M.length?'':'<div class="card">Aucune donnée. Allez dans <b>Données</b> pour importer un fichier Excel.</div>'}`}
function filt(){const q=Q.toLowerCase();return M.filter(m=>(!F.etat||m.etat==F.etat)&&(!F.tour||m.tournee==F.tour)&&(!F.com||m.commune==F.com)&&(!q||[m.num,m.contrat,m.nom,m.adresse,m.rep?.nn].some(v=>String(v??'').toLowerCase().includes(q))))}
const uniq=k=>[...new Set(M.map(m=>m[k]).filter(Boolean))].sort();
function list(){const opt=(a,v)=>'<option value="">Tous</option>'+a.map(x=>`<option ${x==v?'selected':''}>${esc(x)}</option>`).join('');
const L=sortN(filt()).slice(0,100);
return `<input id="q" placeholder="🔍 Recherche (compteur, contrat, client, adresse, nouveau n°)" value="${esc(Q)}" oninput="Q=this.value;lst()">
<button class="s" onclick="nearMe()">${NEAR?'↕ Tri normal':'📍 Près de moi'}</button><div class="g"><div><label>État</label><select onchange="F.etat=this.value;lst()">${opt(ST,F.etat)}</select></div><div><label>Tournée</label><select onchange="F.tour=this.value;lst()">${opt(uniq('tournee'),F.tour)}</select></div></div>
<label>Commune</label><select onchange="F.com=this.value;lst()">${opt(uniq('commune'),F.com)}</select><div id="lst">${items(L)}</div>`}
const items=L=>L.map(m=>`<div class="card row" style="--k:${SC[m.etat]}" onclick="tab='fiche';cur='${m.id}';R()"><div class="it"><b>${esc(m.num)}</b><span class="tag" style="background:${SC[m.etat]}">${m.etat}</span></div>Contrat ${esc(m.contrat)} · ${esc(m.nom)}<br><span class="mut">${esc(m.adresse)}${NEAR&&me&&ll(m)?` · <b>${Math.round(dist([me.lat,me.lon],ll(m)))} m</b>`:''}</span></div>`).join('')||'<div class="card">Aucun résultat</div>';
function lst(){$('#lst').innerHTML=items(sortN(filt()).slice(0,100))}
const gm=g=>{const p=String(g||'').match(/(-?\d+[.,]\d+)[^\d-]*(-?\d+[.,]\d+)/);return p?`https://maps.google.com/?q=${p[1].replace(',','.')},${p[2].replace(',','.')}`:''};
function fiche(){const m=M.find(x=>x.id==cur);if(!m)return list();
return `<button class="s" onclick="go('list')">← Retour</button><div class="card"><b>Informations client</b><br>${esc(m.nom)}<br>Contrat: ${esc(m.contrat)}<br>${esc(m.adresse)}, ${esc(m.commune)}<br>GPS: ${ll(m)?`${ll(m)[0].toFixed(5)}, ${ll(m)[1].toFixed(5)}${m.pos?' (±'+Math.round(m.pos.acc)+' m)':''} · <a href="https://maps.google.com/?q=${ll(m)[0]},${ll(m)[1]}" target="_blank">Ouvrir la position</a>`:'—'}<button class="s" onclick="gpsM('${m.id}',this)">📍 Enregistrer le GPS du compteur</button></div>
<div class="card"><b>Ancien compteur</b><br>N° ${esc(m.num)} · DN ${esc(m.dn)}</div>
<div class="card"><b>Photo avant</b>${m.photos?.avant?`<img class="ph" src="${m.photos.avant}">`:''}${pick(`snapM('${m.id}','avant',this)`)}</div>
<button onclick="startW('${m.id}')">${m.etat=='Terminé'?'REFAIRE LE REMPLACEMENT':'COMMENCER LE REMPLACEMENT'}</button><button class="s" onclick="tab='hist';R()">Historique</button>${m.rep?`<button class="s" onclick="expRepOne('${m.id}')">Image avant / après (ce compteur)</button>`:''}`}
async function snapM(id,k,el){const m=M.find(x=>x.id==id);m.photos=m.photos||{};m.photos[k]=await shrink(el.files[0],k);await put(m);R()}
function hist(){const m=M.find(x=>x.id==cur);return `<button class="s" onclick="tab='fiche';R()">← Retour</button><h3>Historique ${esc(m.num)}</h3>`+((m.hist||[]).slice().reverse().map(h=>`<div class="card"><b>${h.date}</b> ${h.heure}<br>Ancien compteur: ${esc(h.ancien)}<br>Index dépose: ${esc(h.idxD)}<br>Nouveau compteur: ${esc(h.nn)}<br>Index initial: ${esc(h.idxN)}<br>Plomb: ${h.plomb===true?'Oui':esc(h.plomb)||'Non'}<br>GPS: ${esc(h.lat)}, ${esc(h.lon)}<br>Agent: ${esc(h.agent)}<br>Photos: ${Object.keys(h.photos||{}).length}</div>`).join('')||'<div class="card">Aucun historique</div>')}
/* ---- wizard ---- */
function startW(id){cur=id;const m=M.find(x=>x.id==id);D=Object.assign({ancien:m.num,etatC:'Normal',type:m.type,dn:m.dn,test:'OK',etatI:'Bon',photos:{}},{});step=0;if(m.etat=='À faire'){m.etat='En cours';put(m)}getGps();tab='wiz';R()}
